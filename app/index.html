<style>
  /* tokens */

  /* sections, bands, cards */

  .band { display: grid; gap: 24px; padding: 48px 16px; min-width: 0; background: var(--inverted); color: var(--text); border-block: 1px solid var(--dk-hairline);
    --text: var(--dk-text); --text-2: var(--dk-text-2); --text-3: var(--dk-text-3); --hairline: var(--dk-hairline); --control: var(--dk-control); --surface: var(--inverted); }

  /* controls */
  form { display: grid; gap: 16px; }
  .fields { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  textarea { min-height: 280px; font-family: var(--mono); font-size: 0.875rem; line-height: 1.45; resize: vertical; }
  #draft-text { min-height: 360px; line-height: 1.6; padding: 16px; }
  #complaint { max-width: 760px; }
  html[data-bigger] :is(input, select, button, .button) { min-height: 56px; }
  button, .button { font: inherit; font-weight: 600; border-radius: var(--r); padding: 12px 16px; min-height: 48px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; line-height: 1.3; }
  button.secondary, .button.secondary, .speak, .mic { background: transparent; color: var(--text); border-color: var(--control); }

  button:disabled { opacity: 0.55; cursor: progress; }
  /* Unavailable, but still focusable and tappable (it explains itself): outlined and quiet, not a faded primary. */

  .share { background: transparent; color: var(--text); border-color: var(--control); }
  .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }

  .dropzone { position: relative; display: grid; justify-items: center; align-content: center; gap: 8px; min-height: 112px; padding: 16px; border: 2px dashed var(--control); border-radius: var(--r); color: var(--text); font-size: 1.0625rem; font-weight: 600; text-align: center; cursor: pointer; }
  .dropzone input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .dropzone:focus-within { outline: 2px solid var(--text); outline-offset: 2px; }

  .mic[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .with-mic { position: relative; }
  .with-mic input { padding-right: 80px; }
  .with-mic.has-mic input { padding-right: calc(80px + 44px); }
  .with-mic .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-2); pointer-events: none; }
  .with-mic.has-mic .unit { right: 60px; }
  .status { min-height: 1.5em; padding: 0 16px; color: var(--text-2); font-size: 0.9375rem; }

  /* setup wizard */

  .big-choice { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
  .big-choice label { position: relative; display: grid; place-items: center; gap: 4px; min-height: 64px; padding: 8px; border: 1px solid var(--control); border-radius: var(--r); color: var(--text); font-weight: 600; cursor: pointer; text-align: center; }
  .big-choice input { position: absolute; top: 0; left: 0; width: 1px; height: 1px; min-height: 0; margin: 0; padding: 0; opacity: 0; }  /* in the corner: never over the label's text */

  button.hero-btn { min-height: 64px; font-size: 1.125rem; width: 100%; }

  /* Today: hero band */
  #hero { gap: 32px; }
  #light-card, #headline { display: grid; gap: 16px; }
  .light-sentence { font-size: clamp(1.75rem, 4.5vw, 3.25rem); font-weight: 600; line-height: 1.15; }

  .light { display: grid; grid-template-columns: 72px 1fr; gap: 16px; align-items: center; }
  .light-icon { width: 72px; height: 72px; }
  .hero { display: flex; gap: 16px; align-items: center; }
  .ring { position: relative; flex: none; width: 128px; height: 128px; display: grid; place-items: center; }

  /* Today: impact, loop, plant, privacy, AWS */
  .impact-grid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

  .tag { display: inline-block; font-family: var(--mono); font-size: 0.8125rem; line-height: 1.4; padding: 0 8px; border: 1px solid var(--control); border-radius: var(--pill); color: var(--text-2); vertical-align: middle; }

  .assume { display: grid; gap: 12px; }

// Network policy: assumptions of master prompt v4 for 2-5 Mbps, not measured. A read (the audit) gives up after 12 s and is tried
// 2 more times, 1 s and 3 s later plus up to 0.4 s of jitter. A photo read waits 30 s, any other write 20 s. A write is never tried
// again by the page; the owner decides (the offline queue below is the one owner-confirmed exception).

      body: body ? JSON.stringify(body) : undefined,
      signal: stop.signal,

    const err = new Error(t('netFail'));

  try { data = await res.json(); } catch { /* no body */ }

    const fallback = res.status === 429 || res.status >= 500 ? t('busyFail') : t('checkValues');
    const err = new Error(typeof detail === 'string' ? (lang === 'en' ? detail : (serverText(detail) ?? detail)) : fallback);
    err.status = res.status;

    catch (e) {

      if (!again) throw e;
      await wait(NET.backoffMs[attempt] + Math.random() * NET.jitterMs);

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(t('photoOpenFail')));
    img.src = url;

}

// Re-encode on this device: smaller upload, and photo metadata such as location is dropped.
async function photoToJpegBase64(file) {
  const url = URL.createObjectURL(file);
  state.photoUrl = url;
  const img = await loadImage(url);
  const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
  const dataUrl = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error(t('photoReadFail')));
    r.readAsDataURL(blob);
  });
  return String(dataUrl).split(',')[1];
}

async function readPhoto(file) {

// Ring gauge: the arc's stroke-dashoffset eases from the last value shown to this one.
function gauge(frac, dip) {
  const R = 52;
  const C = 2 * Math.PI * R;
  const root = svg('svg', { class: 'gauge', viewBox: '0 0 128 128', 'aria-hidden': 'true' });
  root.append(svg('circle', { class: 'gauge-track', cx: 64, cy: 64, r: R }));
  const arc = svg('circle', { class: dip ? 'gauge-arc dip' : 'gauge-arc', cx: 64, cy: 64, r: R,
    'stroke-dasharray': C.toFixed(2), transform: 'rotate(-90 64 64)' });
  const target = C * (1 - Math.max(0, Math.min(1, frac)));
  if (calm()) {
    arc.style.strokeDashoffset = target.toFixed(2);
  } else {
    arc.style.strokeDashoffset = (C * (1 - state.heroFrac)).toFixed(2);
    nextFrame(() => { arc.style.strokeDashoffset = target.toFixed(2); });
  }
  root.append(arc);
  return root;
}

  } else if (kind === 'bad') {

// impact strip: the output shortfall, rupees, avoided grid CO2 and cleanings avoided, from editable assumptions
function assumptions() {
  const raw = jsonGet(ASSUME_KEY);
  const saved = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
  const out = { ...ASSUME_DEFAULTS };
  for (const k of Object.keys(ASSUME_DEFAULTS)) {
    if (!(k in saved)) continue;
    if (ASSUME_TEXT.includes(k)) { if (typeof saved[k] === 'string') out[k] = saved[k].slice(0, 80); continue; }
    if (k === 'co2' && saved[k] === null) { out[k] = null; continue; }
    if (saved[k] === null || saved[k] === '' || typeof saved[k] === 'boolean') continue;
    const v = Number(saved[k]);
    if (Number.isFinite(v) && v >= 0) out[k] = v;
  }
  return out;
}
// The last 30 days of logged readings; a weekly reading counts for its 7 days. Unlogged days count for nothing.
function lossWindow(a) {
  const tl = a.timeline;
  if (!tl.length) return null;
  const end = new Date(`${tl[tl.length - 1].date}T00:00:00`);
  const start = new Date(end); start.setDate(start.getDate() - 29);
  const inWindow = tl.filter((p) => new Date(`${p.date}T00:00:00`) >= start);
  let lost = 0, days = 0, dips = 0, actual = 0, expected = 0;
  for (const p of inWindow) {
    days += p.kind === 'weekly' ? 7 : 1;
    actual += p.kwh; expected += usualKwh(p, a);
    // Only the days the audit flags as dips count as loss: ordinary days scatter around the usual level.
    if (p.flagged) { dips += 1; lost += Math.max(0, usualKwh(p, a) - p.kwh); }
  }
  return { lost, days, dips, actual, expected, from: inWindow[0].date, to: tl[tl.length - 1].date, usualIsPvgis: !a.baseline.learnt };
}
function renderImpact(a) {

  card.hidden = !w;
  if (!w) return;
  const A = assumptions();
  const f = $('assume-form');
  for (const k of Object.keys(ASSUME_DEFAULTS)) f[k].value = A[k] ?? '';
  const dust = a.hypotheses.find((h) => h.cause === 'soiling');
  const dustSupported = Boolean(dust && dust.confidence !== 'low');
  const money = w.lost * A.tariff;
  const perDay = w.days ? w.lost / w.days : 0;

  $('impact-sub').textContent = tf('impactSub', { from: fmtDate(w.from), to: fmtDate(w.to), days: w.days, dips: w.dips, actual: kwh(w.actual), expected: kwh(w.expected), u: units(), ref: w.usualIsPvgis ? t('refEstimate') : t('refUsual') });
  $('impact-grid').replaceChildren(
    el('div', { class: 'stat' }, el('span', { class: 'label', text: t('unitsLost') }), el('span', { class: 'value', text: `${kwh(w.lost)} ${units()}` }), el('span', { class: 'sub', text: tf('perDay', { n: `${kwh(perDay)} ${units()}` }) })),
    el('div', { class: 'stat' }, el('span', { class: 'label', text: t('worth') }), el('span', { class: 'value', text: rupees(money) }), el('span', { class: 'sub', text: tf('atTariff', { n: A.tariff }) })));
  // Avoided grid CO2: only with an emission factor, and always worded as what the shortfall would have displaced.
  $('co2-line').textContent = A.co2 == null ? t('noFactor')
    : tf('co2Line', { y: (w.lost * A.co2).toLocaleString('en-IN', { maximumFractionDigits: 1 }), f: A.co2 });

  // Cleaning payback, only while dust is a possible cause the audit still supports.
  const roi = $('roi');
  roi.replaceChildren();
  const cleanCost = A.clean_cost_per_kw * a.site.kw;
  if (dustSupported) {
    const daily = perDay * A.tariff;
    const lead = daily > 0
      ? tf('roiPays', { cost: rupees(cleanCost), kw: a.site.kw, days: daily >= cleanCost ? t('roiDay') : tf('roiDays', { n: Math.ceil(cleanCost / daily) }) })
      : tf('roiNoLoss', { cost: rupees(cleanCost), kw: a.site.kw });
    roi.append(el('div', { class: 'callout' }, icon('info'),
      el('p', {}, el('strong', { text: lead }), tf('roiTail', { conf: t(`conf_${dust.confidence}`) }))));
  }

  const needed = dustSupported ? 1 : 0;
  $('cleanings').textContent = tf('cleaningsLine', { saved: kwh(Math.max(0, A.cleans_per_month - needed)), fixed: kwh(A.cleans_per_month), needed });

  $('method-note').hidden = lang === 'en';
  $('method-note').textContent = t('inEnglish');
  $('method').replaceChildren(
    el('li', {}, 'Output shortfall = on each day in the last 30 that the audit flags as a dip, the shortfall below the plant\u2019s usual output (expected output from PVGIS and NASA POWER weather, scaled by the level this plant was learnt to run at), added up. Ordinary days, above or below usual, count for nothing.'),
    el('li', {}, 'Rupees = output shortfall \u00d7 tariff.'),
    el('li', {}, 'Avoided grid CO\u2082 = output shortfall \u00d7 emission factor: the grid CO\u2082 the plant would have displaced had it made that energy. It is not a measured saving, and it is shown only while an emission factor is set.'),
    el('li', {}, 'Payback days = cost of one clean \u00f7 rupees lost per day. Shown only while dust is a possible cause at medium or high confidence.'),
    el('li', {}, 'Cleanings avoided = cleans a month on the fixed schedule \u2212 cleans the audit suggests now (one while dust is a possible cause at medium or high confidence, otherwise none), never below zero.'));
  $('assume-sources').replaceChildren(...ASSUME_SOURCES.map((src) => el('li', {}, src.text,

$('assume-form').addEventListener('submit', (ev) => {

function outcomeChip(v) {

// Waiting -> checking -> result; the line between the steps grows when the suggestion moves on.
function stepper(action) {
  const v = action.verification;
  const idx = v.outcome === 'not_approved' ? 0 : v.outcome === 'pending' ? 1 : 2;
  const result = v.outcome === 'recovered' ? t('stepBack') : v.outcome === 'not_recovered' ? t('stepNotBack') : t('stepResult');
  const list = el('ol', { class: 'steps', 'aria-label': t('progressLabel') });
  [t('stepWaiting'), t('stepChecking'), result].forEach((label, i) => {
    list.append(el('li', { class: i < idx ? 'done' : null, 'aria-current': i === idx ? 'step' : null },
      el('span', { class: 'step-dot', 'aria-hidden': 'true' }), el('span', { text: label })));
  });
  const fill = el('span', { class: 'steps-fill' });
  const prev = state.prevSteps[action.id];
  const from = prev == null || calm() ? idx : Math.min(prev, idx);
  fill.style.transform = `scaleX(${from / 2})`;
  if (from !== idx) nextFrame(() => { fill.style.transform = `scaleX(${idx / 2})`; });
  state.prevSteps[action.id] = idx;
  return el('div', { class: 'stepper' }, el('div', { class: 'steps-track', 'aria-hidden': 'true' }, fill), list);
}

function renderActions(a) {

  const rank = (x) => (x.status === 'proposed' && !stale(x) ? 0

// Expected versus actual in kWh on one shared axis: expected is the usual level each bar is judged against.
function drawKwhChart(box, points, a) {
  box.replaceChildren();
  $('kwh-legend').replaceChildren();
  $('kwh-title').hidden = points.length < 2;
  if (points.length < 2) return;
  const W = Math.max(280, Math.round(box.clientWidth || 600));
  const H = 150;
  const m = { t: 10, r: 8, b: 20, l: 40 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const usual = (p) => usualKwh(p, a);
  const top = Math.max(1, ...points.map((p) => Math.max(p.kwh, usual(p))));
  const step = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000].find((v) => top / v <= 6) || 1000;
  const ymax = Math.ceil(top / step) * step;
  const y = (v) => m.t + ph * (1 - Math.min(v, ymax) / ymax);
  const x = (i) => m.l + (i + 0.5) * (pw / points.length);
  const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': tf('kwhChartLabel', { n: points.length }) });
  for (let t = 0; t <= ymax + 1e-9; t += step) {
    root.append(svg('line', { class: 'grid', x1: m.l, x2: W - m.r, y1: y(t), y2: y(t) }),
      svg('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end' }, String(t)));
  }
  const line = (cls, pick) => svg('polyline', { class: cls, points: points.map((p, i) => `${x(i).toFixed(1)},${y(pick(p)).toFixed(1)}`).join(' ') });
  root.append(line('expected', usual), line('actual', (p) => p.kwh));
  points.forEach((p, i) => { if (p.flagged) root.append(svg('circle', { class: 'actual-dot', cx: x(i), cy: y(p.kwh), r: 3.5 })); });
  root.append(svg('text', { x: x(0), y: H - 5, 'text-anchor': 'start' }, fmtDate(points[0].date, true)),
    svg('text', { x: x(points.length - 1), y: H - 5, 'text-anchor': 'end' }, fmtDate(points[points.length - 1].date, true)));
  box.append(root);
  const item = (key, text) => el('li', {}, key, text);
  $('kwh-title').textContent = t('kwhTitle');
  $('kwh-legend').append(item(el('span', { class: 'key-line expected' }), tf('legExpected', { u: units() })), item(el('span', { class: 'key-line actual' }), tf('legMade', { u: units() })),
    item(el('span', { class: 'swatch', style: 'background:var(--accent);border-radius:50%;width:10px;height:10px' }), t('dip')));
}

function renderSources(a) {

function barPath(x, yTop, w, h, r) {
  r = Math.min(r, w / 2, h);
  const yb = yTop + h;
  return `M${x},${yb}V${yTop + r}A${r},${r} 0 0 1 ${x + r},${yTop}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${yTop + r}V${yb}Z`;
}

function pointState(p) {
  if (p.flagged) return 'dip';
  if (p.low_sun || p.relative == null) return 'dim';
  return '';
}

// Draws the bars; returns reveal(i) so the replay can bring bars in one day at a time.
function drawChart(box, points, actions, flagBelow, opts) {
  const o = opts || {};
  box.replaceChildren();
  if (!points.length) return { reveal() {} };
  const W = Math.max(280, Math.round(box.clientWidth || 600));
  state.chartWidth = W;
  const H = 220;
  const m = { t: 14, r: 8, b: 26, l: 40 };
  const pw = W - m.l - m.r;
  const ph = H - m.t - m.b;
  const top = Math.max(1.25, ...points.map((p) => p.relative || 0));
  const ymax = Math.ceil(top / 0.25) * 0.25;
  const y = (v) => m.t + ph * (1 - Math.min(v, ymax) / ymax);
  const slot = pw / points.length;
  const bw = Math.min(24, Math.max(1, slot >= 6 ? slot - 2 : slot * 0.8));

  const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', tabindex: '0',
    'aria-label': tf('chartLabel', { n: points.length }) });
  if (o.animate) root.setAttribute('class', 'animate');
  for (let t = 0; t <= ymax + 1e-9; t += 0.5) {
    root.append(svg('line', { class: t === 0 ? 'usual' : 'grid', x1: m.l, x2: W - m.r, y1: y(t), y2: y(t) }),
      svg('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end' }, `${Math.round(t * 100)}%`));
  }
  root.append(svg('line', { class: 'usual', x1: m.l, x2: W - m.r, y1: y(1), y2: y(1) }));

  const bars = [];
  points.forEach((p, i) => {
    const v = p.relative || 0;
    const x = m.l + i * slot + (slot - bw) / 2;
    const h = Math.max(2, y(0) - y(v));
    const cls = ['bar', pointState(p), p.weather_known ? '' : 'unknown', o.hold ? 'hold' : ''].filter(Boolean).join(' ');
    const bar = svg('path', { class: cls, d: barPath(x, y(0) - h, bw, h, 4), 'data-dip': String(p.flagged) });
    bar.style.setProperty('--d', String(i));
    bars.push(bar);
    root.append(bar);
  });
  // Dip threshold, drawn over the bars so it stays visible; the legend names it.
  root.append(svg('line', { class: 'threshold', x1: m.l, x2: W - m.r, y1: y(flagBelow), y2: y(flagBelow) }));

  for (const act of actions) {
    if (act.status !== 'approved') continue;
    const idx = points.findIndex((p) => p.date > act.approved_on);
    if (idx <= 0) continue;
    const x = m.l + idx * slot;
    root.append(svg('line', { class: 'approved', x1: x, x2: x, y1: m.t, y2: m.t + ph }));
  }

  const labelAt = (i, anchor) => root.append(svg('text', { x: m.l + (i + 0.5) * slot, y: H - 6, 'text-anchor': anchor }, fmtDate(points[i].date, true)));
  labelAt(0, 'start');
  if (points.length > 1) labelAt(points.length - 1, 'end');
  if (points.length > 8 && W > 420) labelAt(Math.floor(points.length / 2), 'middle');

  const hit = svg('rect', { class: 'hit', x: m.l, y: m.t, width: pw, height: ph + m.b });
  root.append(hit);
  box.append(root);

  const tip = el('div', { class: 'tip', hidden: true });
  box.append(tip);
  let current = -1;
  function show(i) {
    if (i < 0 || i >= points.length) return;
    if (current >= 0) bars[current].classList.remove('active');
    current = i;
    bars[i].classList.add('active');
    const p = points[i];
    const note = p.flagged ? tf('tipDip', { n: Math.round(flagBelow * 100) })
      : p.low_sun ? t('dimDay')
      : !p.weather_known ? t('legUnknown') : '';
    tip.replaceChildren(
      el('strong', { text: p.relative == null ? t('lightNoDetail') : pctText(p) }),
      el('span', { text: `${fmtDate(p.date)}${p.kind === 'weekly' ? ` (${t('noteWeek')})` : ''}` }),
      el('span', { text: `${kwh(p.kwh)} ${units()}, ${t('expected')} ${kwh(p.expected_kwh)}` }),
      note ? el('span', { text: note }) : null);
    tip.hidden = false;
    const scale = box.clientWidth / W;
    const cx = (m.l + (i + 0.5) * slot) * scale;
    const left = Math.min(Math.max(0, cx - tip.offsetWidth / 2), box.clientWidth - tip.offsetWidth);
    tip.style.left = `${left}px`;
    tip.style.top = `${Math.max(0, y(Math.min(p.relative || 0, ymax)) * scale - tip.offsetHeight - 10)}px`;
  }
  function hide() { tip.hidden = true; if (current >= 0) bars[current].classList.remove('active'); }
  const pick = (ev) => {
    const r = root.getBoundingClientRect();
    const x = (ev.clientX - r.left) * (W / r.width);
    show(Math.floor((x - m.l) / slot));
  };
  root.addEventListener('pointermove', pick);
  root.addEventListener('pointerdown', pick);
  root.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') hide(); });
  root.addEventListener('blur', hide);
  root.addEventListener('focus', () => show(current >= 0 ? current : points.length - 1));
  root.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); show(Math.max(0, current - 1)); }
    if (ev.key === 'ArrowRight') { ev.preventDefault(); show(Math.min(points.length - 1, current + 1)); }
    if (ev.key === 'Escape') hide();
  });
  return {
    reveal(i) {
      const bar = bars[i];
      if (!bar) return;
      bar.classList.remove('hold');
      if (!calm()) bar.classList.add('pop');
    },
  };
}

// ---------- replay: the synthetic scenario's days appear one by one ----------
function stopReplay(finished) {
  if (!state.replay) return;
  clearInterval(state.replay);
  state.replay = null;
  const a = state.audit;
  if (!a) return;
  $('replay-btn').textContent = tf('replay', { n: Math.min(a.timeline.length, CHART_MAX) });
  if (finished) {
    const shown = a.timeline.slice(-CHART_MAX);
    $('replay-caption').textContent = tf('replayDone', { n: shown.length, dips: shown.filter((p) => p.flagged).length });
    say($('replay-caption').textContent);  // announced once, not on every day
  } else {
    $('replay-caption').textContent = '';
    if (state.tab === 'why') {
      drawChart($('chart'), a.timeline.slice(-CHART_MAX), a.actions, a.flag_below, {});
      drawKwhChart($('kwh-chart'), a.timeline.slice(-CHART_MAX), a);
    }
  }
}

$('replay-btn').addEventListener('click', () => {
  if (state.replay) { stopReplay(false); return; }
  const a = state.audit;
  const points = a.timeline.slice(-CHART_MAX);
  const chart = drawChart($('chart'), points, a.actions, a.flag_below, { hold: true });
  $('replay-btn').textContent = t('stopReplay');
  let i = 0;
  state.replay = setInterval(() => {
    if (i >= points.length) { stopReplay(true); return; }
    chart.reveal(i);
    const p = points[i];
    $('replay-caption').textContent = `${tf('dayOf', { i: i + 1, n: points.length })} · ${fmtDate(p.date)}: ${p.relative == null ? '–' : pctText(p)}${p.flagged ? ` (${t('noteDip')})` : ''}`;
    i += 1;
  }, 110);
});

function renderLegend(tl, a) {
  const legend = $('legend');
  legend.replaceChildren();
  if (!tl.length) return;
  const item = (key, text) => el('li', {}, key, text);
  const swatch = (color, extra) => el('span', { class: 'swatch', style: `background:${color};${extra || ''}` });
  const line = Math.round(a.flag_below * 100);
  legend.append(item(swatch('var(--text-2)'), t('legReading')),
    item(swatch('var(--accent)'), tf('legDip', { n: line })),
    item(el('span', { class: 'key-line dash' }), tf('legLine', { n: line })));
  if (tl.some((p) => p.low_sun)) legend.append(item(swatch('transparent', 'border:1.5px solid var(--text-3)'), t('legDim')));
  if (tl.some((p) => !p.weather_known)) legend.append(item(swatch('var(--text-2)', 'opacity:.5'), t('legUnknown')));
  if (a.actions.some((x) => x.status === 'approved' && tl.some((p) => p.date > x.approved_on))) {
    legend.append(item(el('span', { class: 'key-line solid' }), t('legApproved')));
  }
}

function renderTable(tl) {
  const table = $('table');
  table.replaceChildren();
  if (!tl.length) return;
  table.append(el('thead', {}, el('tr', {},
    el('th', { scope: 'col', text: t('date') }), el('th', { scope: 'col', text: units() }),
    el('th', { scope: 'col', text: t('thExpected') }), el('th', { scope: 'col', text: t('thShare') }), el('th', { scope: 'col', text: t('thNote') }))));
  const body = el('tbody');
  for (const p of [...tl].reverse()) {
    const notes = [];
    if (p.flagged) notes.push(t('noteDip'));
    if (p.low_sun) notes.push(t('noteDim'));
    if (!p.weather_known) notes.push(t('noteUnknown'));
    if (p.kind === 'weekly') notes.push(t('noteWeek'));
    body.append(el('tr', {},
      el('td', { text: fmtDate(p.date) }), el('td', { text: kwh(p.kwh) }), el('td', { text: kwh(p.expected_kwh) }),
      el('td', { text: p.relative == null ? '–' : pctText(p) }), el('td', { text: notes.join(', ') })));
  }
  table.append(body);
}

function renderCauses(a) {
  const list = $('cause-list');
  list.replaceChildren();
  let english = false;
  a.hypotheses.forEach((h, i) => {
    const why = h.why.map((w) => srvProps(w));
    english = english || why.some((p) => p['data-srv'] && p['data-srv'] !== 'translated');
    list.append(el('li', { class: 'cause', 'data-cause': h.cause },
      el('div', { class: 'cause-head' },
        el('h3', {}, el('span', { class: 'rank', text: `${i + 1}. ` }), CAUSES[h.cause] || h.cause),
        confidence(h.confidence)),
      el('ul', {}, ...why.map((p) => el('li', p)))));
  });
  if (english) list.prepend(el('li', { class: 'note', text: t('inEnglish') }));
}

function renderEscalation(a) {
  const box = $('escalation');
  box.replaceChildren();
  const e = a.escalation;
  const button = $('draft-btn');
  if (e.suggested) {
    box.append(el('div', { class: 'callout critical' }, icon('warn'),
      el('div', {}, el('strong', { text: t('escNotBack') }),
        el('ul', {}, ...e.why.map((w) => el('li', srvProps(w)))))));
    button.className = '';
  } else {
    button.className = 'secondary';
    if (e.waiting_for_weather.length) {
      box.append(el('div', { class: 'callout' }, icon('clock'),
        el('div', {}, el('strong', { text: t('escWaiting') }),
          el('ul', {}, ...e.waiting_for_weather.map((w) => el('li', srvProps(w)))))));
    } else {
      box.append(el('p', { class: 'muted small', text: t('escAnytime') }));
    }
  }
}

let resizeFrame = 0;
new ResizeObserver(() => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => {
    const box = $('chart');
    if (!state.audit || state.replay || state.tab !== 'why' || $('site').hidden) return;
    if (Math.abs(Math.round(box.clientWidth) - state.chartWidth) < 2) return;
    drawChart(box, state.audit.timeline.slice(-CHART_MAX), state.audit.actions, state.audit.flag_below, {});
    drawKwhChart($('kwh-chart'), state.audit.timeline.slice(-CHART_MAX), state.audit);
  });
}).observe($('chart'));

// start
async function load(id) {
  const audit = await api('GET', `/api/sites/${encodeURIComponent(id)}/audit`);
  if (state.id !== id) clearImport();
  state.id = id;
  render(audit);
  const tab = tabFromHash();
  if (!tab) history.replaceState(null, '', `${location.pathname}${location.search}#today`);
  showTab(tab || 'today', true);
  if (navigator.onLine) flushQueue();  // readings queued while offline, if any
}

(async function init() {
  const fromUrl = new URLSearchParams(location.search).get('site');
  const stored = storeGet();
  let current = null;
  async function attempt(id) {
    current = id;
    $('retry').hidden = true;
    const kept = lastGet(id);
    let drawn = false;
    if (kept) {
      try {
        state.id = id;
        state.cached = { at: kept.savedAt, failed: false };
        render(kept.audit, { cached: true });
        const tab = tabFromHash();
        showTab(tab || 'today', true);
        drawn = true;
      } catch { lastClear(id); state.cached = null; state.id = null; state.audit = null; }
    }
    $('skeleton').hidden = drawn;  // the shimmer shows only when nothing is saved
    $('main').setAttribute('aria-busy', 'true');
    try {
      await load(id);
      if (id === fromUrl && id !== stored && (!stored
          || confirm(t('linkOther')))) {
        storeSet(id);
      }
    } catch (e) {
      $('skeleton').hidden = true;
      if (e.status !== 404) {
        if (drawn && state.cached) { state.cached.failed = true; renderSavedNote(); }  // keep what is saved, and say it is not current
        showError(e.message); $('retry').hidden = false; return;
      }
      lastClear(id);
      if (id === fromUrl) {
        history.replaceState(null, '', `${location.pathname}${location.hash}`);
        if (stored && stored !== id) {
          await attempt(stored);
          if (state.audit) showError(t('linkNotFoundKept'));
          return;
        }
      }
      if (storeGet() === id) storeClear();
      showSetup(id === fromUrl ? t('linkNotFound') : t('plantGone'));
    } finally {
      $('main').removeAttribute('aria-busy');
    }
  }
  $('retry-btn').addEventListener('click', () => { showError(''); attempt(current); });
  const first = fromUrl || stored;
  if (first) await attempt(first); else showSetup();
})();
</script>
