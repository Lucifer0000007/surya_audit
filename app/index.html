  :root[data-lang="hi"] body, :root[data-lang="pa"] body { font-family: "Surya Indic", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  :root[data-bigger] { font-size: 118.75%; }
  :root[data-bigger] input, :root[data-bigger] select, :root[data-bigger] button, :root[data-bigger] .button { min-height: 56px; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; -webkit-tap-highlight-color: rgba(237, 161, 0, 0.18); }
  body { margin: 0; background: var(--page); color: var(--ink); line-height: 1.65; font-size: 1rem; min-height: 100dvh; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 var(--s2); }
  [hidden] { display: none !important; }
  a { color: var(--accent-text); text-underline-offset: 2px; }
  h1, h2, h3 { line-height: 1.25; margin: 0; text-wrap: balance; }
  :root[data-lang="en"] :is(h1, h2, h3) { letter-spacing: -0.01em; }
  :root:is([data-lang="hi"], [data-lang="pa"]) :is(h1, h2, h3) { line-height: 1.4; }
  h2 { font-size: 1.125rem; }
  h3 { font-size: 1rem; }
  p { margin: 0; }
  .muted { color: var(--ink-2); }
  .small { font-size: 0.9375rem; }
  .note { font-size: 0.9375rem; color: var(--ink-2); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .skip { position: absolute; left: var(--s2); top: -64px; z-index: 40; padding: 12px var(--s2); border-radius: var(--r-md); background: var(--ink); color: var(--surface); font-weight: 600; text-decoration: none; }
  .skip:focus { top: var(--s1); }
  a, button, input, select, summary, label { touch-action: manipulation; }

  /* ---------- top bar ---------- */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
  .topbar .wrap { display: flex; align-items: center; gap: var(--s2); min-height: 56px; }
  .brand { display: flex; align-items: center; gap: var(--s1); font-weight: 650; font-size: 1.125rem; }
  .brand svg { flex: none; }
  .tagline { color: var(--ink-2); font-size: 0.875rem; margin-left: auto; text-align: right; }
  .prefs { display: flex; gap: var(--s1); align-items: center; margin-left: auto; }
  .tagline + .prefs { margin-left: 0; }
  .lang { display: inline-flex; border: 1px solid var(--control); border-radius: 999px; padding: 0; }
  .lang button { min-height: 48px; min-width: 48px; padding: 6px 10px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font-weight: 600; }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  .prefs .bigger { min-height: 48px; min-width: 48px; padding: 6px 10px; background: transparent; border: 1px solid var(--control); color: var(--ink); font-weight: 700; }
  .prefs .bigger[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

  main { padding-top: var(--s2); padding-bottom: var(--s3); display: grid; gap: var(--s2); }
  #site, #panels, [role="tabpanel"] { display: grid; gap: var(--s2); min-width: 0; }

  /* ---------- cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s2); display: grid; gap: var(--s2); min-width: 0; }
  .card > header { display: grid; gap: 4px; }
  .privacy ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
  @media (min-width: 720px) { .card { padding: var(--s3); } }
  @media (min-width: 1100px) { .card { padding: var(--s4); } }

  #banners:empty { display: none; }
  .strip { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
  .strip > summary { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s1) 12px; min-height: 48px; padding: 8px 12px; color: var(--ink); list-style: none; }
  .strip > summary::-webkit-details-marker { display: none; }
  .flags { display: flex; flex-wrap: wrap; gap: var(--s1); }
  .flag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--control); border-radius: 999px; font-size: 0.9375rem; }
  .flag.synthetic { border-color: var(--warning); background: color-mix(in srgb, var(--warning) 14%, var(--surface)); }
  .more { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); font-size: 0.875rem; }
  .chev { flex: none; transition: transform 160ms var(--ease); }
  .strip[open] .chev { transform: rotate(180deg); }
  .strip-body { display: grid; gap: var(--s1); padding: 0 12px 12px; }
  .strip-body p { display: flex; gap: 12px; align-items: flex-start; padding: 8px 12px; border-radius: var(--r-md); background: var(--surface-2); }
  .strip-body p.synthetic { background: color-mix(in srgb, var(--warning) 14%, var(--surface)); }
  .strip-body svg { flex: none; margin-top: 5px; }

  /* ---------- controls ---------- */
  form { display: grid; gap: var(--s2); }

// parts: [{ text, lang }]. Each part is spoken by a voice for its own language, so the audit's English
// sentences are never read by a Hindi or Punjabi voice; a part with no voice on this device is skipped.
function speakButton(partsFn) {
  if (!('speechSynthesis' in window) || !voiceFor(SPEECH_LANG[lang])) return null;  // no voice for this language: no button
  const b = el('button', { type: 'button', class: 'secondary speak', 'aria-pressed': 'false' },
    svg('svg', { width: 20, height: 20, viewBox: '0 0 24 24', 'aria-hidden': 'true', fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }),
    el('span', { text: t('readAloud') }));
  b.querySelector('svg').append(svg('path', { d: 'M4 10v4h4l5 4V6L8 10H4zm12-2a5 5 0 0 1 0 8m3-11a9 9 0 0 1 0 14' }));
  b.addEventListener('click', () => {
    if (speakingButton === b) { stopSpeaking(); return; }
    stopSpeaking();
    const parts = partsFn().map((p) => ({ ...p, voice: voiceFor(SPEECH_LANG[p.lang]) })).filter((p) => p.voice && p.text);
    if (!parts.length) return;
    speakingButton = b;
    b.setAttribute('aria-pressed', 'true');
    b.querySelector('span').textContent = t('stopReading');
    parts.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p.text);
      u.voice = p.voice;
      u.lang = p.voice.lang;
      if (i === parts.length - 1) u.onend = () => { if (speakingButton === b) stopSpeaking(); };
      u.onerror = () => { if (speakingButton === b) stopSpeaking(); };
      speechSynthesis.speak(u);  // queued in order
    });
  });
  return b;
}

(function initMic() {
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Rec) return;  // no voice input here: the field is typed
  const mic = $('mic');
  mic.hidden = false;
  mic.closest('.with-mic').classList.add('has-mic');
  $('mic-note').hidden = false;
  let rec = null;
  mic.addEventListener('click', () => {
    if (rec) { rec.stop(); return; }
    rec = new Rec();
    rec.lang = SPEECH_LANG[lang];
    rec.interimResults = false;
    rec.maxAlternatives = 3;
    mic.setAttribute('aria-pressed', 'true');
    say(t('listening'));
    rec.onresult = (ev) => {
      // Take the first alternative that contains a number (Indian digits too); "twelve point four" is left to the
      // browser's numeric output. In en-IN, hi-IN and pa-IN a comma groups thousands ("12,345"), never a decimal.
      for (const alt of Array.from(ev.results[0])) {
        const m = alt.transcript.replace(/[०-९]/g, (d) => '०१२३४५६७८९'.indexOf(d)).replace(/[੦-੯]/g, (d) => '੦੧੨੩੪੫੬੭੮੯'.indexOf(d)).match(/\d[\d,]*(\.\d+)?/);
        if (m) { const value = m[0].replace(/,/g, ''); setKwh(value); say(`${value} ${units()}`); return; }
      }
      say(t('speakValue'));
    };
    rec.onend = rec.onerror = () => { rec = null; mic.setAttribute('aria-pressed', 'false'); };
    try { rec.start(); } catch { rec = null; mic.setAttribute('aria-pressed', 'false'); }
  });
})();

const isIndic = (s) => /[\u0900-\u0A7F]/.test(s);
// A message the page could not translate is English: say so for screen readers.
function msgNode(msg) { return el('span', { text: msg, lang: lang !== 'en' && !isIndic(msg) ? 'en' : null }); }

async function api(method, path, body) {
  let res;
  try {
    res = await fetch(path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch {
    throw new Error(t('netFail'));
  }
  let data = null;
  try { data = await res.json(); } catch { /* no body */ }
  if (!res.ok) {
    const detail = data && data.detail;
    // API Gateway's own timeouts and errors carry no "detail": say what happened, not "check the values".
    const fallback = res.status === 429 || res.status >= 500 ? t('busyFail') : t('checkValues');
    const err = new Error(typeof detail === 'string' ? (lang === 'en' ? detail : (serverText(detail) ?? detail)) : fallback);
    err.status = res.status;
    throw err;
  }
  return data;
}

// ---------- tabs: ARIA tablist, roving tabindex, URL hash, Back button ----------
const tablist = $('tablist');
const tabButton = (name) => $(`tab-${name}`);
function tabFromHash() {
  const h = location.hash.slice(1);  // tab names are ASCII, so no decoding (a mangled "#%" would throw)
  return TABS.includes(h) ? h : null;
}

function showTab(name, force) {
  const from = state.tab;
  if (from === name && !force) return;
  // The selected state is applied synchronously, so it never depends on the order in which
  // hashchange events and view-transition callbacks arrive. The transition only animates.
  for (const t of TABS) {
    const on = t === name;
    const b = tabButton(t);
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
  }
  state.tab = name;
  const swap = () => { for (const t of TABS) $(`panel-${t}`).hidden = t !== name; onTabShown(name); };
  const animate = !calm() && from !== name && !$('site').hidden;
  if (animate && document.startViewTransition) {
    const transition = document.startViewTransition(swap);
    // If a newer tab change arrives before this one finishes, its own swap wins; nothing to undo.
    transition.updateCallbackDone.catch(() => {});
  } else {
    swap();
    if (animate) {
      const p = $(`panel-${name}`);
      p.classList.remove('fade-in');
      void p.offsetWidth;
      p.classList.add('fade-in');
    }
  }
  // Keep the newly shown panel's top in view when the page was scrolled down.
  const top = $('panels').getBoundingClientRect().top;
  if (top < 0) window.scrollBy(0, top - 72);
}

function goTo(name, focusTab) {
  if (focusTab) tabButton(name).focus();
  showTab(name);
  // The hash records the tab for Back, reload and links; the hashchange handler finds it already shown.
  if (tabFromHash() !== name) history.pushState(null, '', `#${name}`);
}

function onTabShown(name) {
  if (name === 'why' && state.audit) drawTimelineChart();
}

tablist.addEventListener('click', (ev) => {
  const b = ev.target.closest('[role="tab"]');
  if (b) goTo(b.dataset.tab, false);
});
tablist.addEventListener('keydown', (ev) => {
  // Arrows move from the focused tab, not from state.tab: panels switch on the asynchronous
  // hashchange event, so two quick key presses would otherwise start from a stale tab.
  const focused = document.activeElement && document.activeElement.closest('[role="tab"]');
  const i = Math.max(0, TABS.indexOf(focused ? focused.dataset.tab : state.tab));
  const target = { ArrowRight: (i + 1) % TABS.length, ArrowLeft: (i + TABS.length - 1) % TABS.length, Home: 0, End: TABS.length - 1 }[ev.key];
  if (target == null) return;
  ev.preventDefault();
  goTo(TABS[target], true);
});
// Back/Forward and links that change the fragment: show that tab (a no-op if it is already shown).
window.addEventListener('popstate', () => {
  if ($('site').hidden) return;
  const name = tabFromHash();
  if (name) showTab(name);
});
window.addEventListener('hashchange', () => {
  if ($('site').hidden) return;
  const name = tabFromHash();
  if (name) showTab(name);
});

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(t('photoOpenFail')));
    img.src = url;
  });
}

// Re-encode on this device: smaller upload, and photo metadata such as location is dropped.
async function photoToJpegBase64(file) {
  const url = URL.createObjectURL(file);
  state.photoUrl = url;
  const img = await loadImage(url);
  const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
  const dataUrl = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error(t('photoReadFail')));
    r.readAsDataURL(blob);
  });
  return String(dataUrl).split(',')[1];
}

// The zone also takes a dropped screenshot (desktop); the picker above stays the way on a phone.
{

// What a photo filled in is cleared when a new photo is picked or this one is discarded, unless the owner changed any of it:
// then all of it is theirs (otherwise a photo that reads nothing would sit under the old photo's date and energy, or one
// reading would be split in two).
function undoPhotoFill() {
  const f = $('reading-form'), was = state.photoFill;
  state.photoFill = null;
  if (!was || Object.keys(was).some((k) => f[k].value !== was[k])) return;
  if ('date' in was) setReadingDate(todayIso());

  if ('kind' in was) f.kind.value = 'daily';
}
async function readPhoto(file) {
  showError('');
  undoPhotoFill();
  if (state.photoUrl) URL.revokeObjectURL(state.photoUrl);
  const seq = ++state.photoSeq;
  let image;
  try { image = await photoToJpegBase64(file); }
  catch (e) { if (seq === state.photoSeq) { clearPhoto(); showError(e.message); } return; }
  if (seq !== state.photoSeq) return;
  $('photo-thumb').src = state.photoUrl;
  $('photo-review').hidden = false;
  $('photo-note').textContent = t('photoReading');
  try {
    const res = await api('POST', `/api/sites/${encodeURIComponent(state.id)}/extract`, { image_base64: image, mime_type: 'image/jpeg' });
    if (seq !== state.photoSeq) return;
    const c = res.candidate || {};
    const f = $('reading-form');
    const fill = {};
    if (c.date) { setReadingDate(c.date); fill.date = f.date.value; }
    if (c.kwh != null) { setKwh(c.kwh); fill.kwh = f.kwh.value; }
    if (c.kind && c.kwh != null) { f.kind.value = c.kind; fill.kind = f.kind.value; }  // the period says what the energy covers
    state.photoFill = fill;

    if (c.kwh == null && c.cumulative_meter_kwh != null) parts.push(`${tf('photoLifetime', { kwh: kwh(c.cumulative_meter_kwh), u: units() })} `);
    const energy = c.kwh != null || c.cumulative_meter_kwh != null;
    if (!energy) parts.push(`${t('photoNothing')} `);
    if (energy || fill.date) parts.push(t('photoCheck'));
    $('photo-note').replaceChildren(...parts);
  } catch (e) {
    if (seq !== state.photoSeq) return;
    $('photo-note').replaceChildren(msgNode(e.message), ` ${t('photoNotSaved')}`);
    $('reading-form').kwh.focus();
  }
}

// The audit's own verdict names a cause at the level it suggests actions for (its threshold, not the page's).
// A plant low since day one, or one slowly soiling, is never flagged against its own baseline, so this is

// verdict (nothing is ever suggested for it), so it never counts.

// ---------- impact strip: the output shortfall, rupees, avoided grid CO2 and cleanings avoided, from editable assumptions ----------
function assumptions() {
  const saved = jsonGet(ASSUME_KEY) || {};
  const out = { ...ASSUME_DEFAULTS };
  for (const k of Object.keys(ASSUME_DEFAULTS)) {
    if (!(k in saved)) continue;
    if (ASSUME_TEXT.includes(k)) { if (typeof saved[k] === 'string') out[k] = saved[k].slice(0, 80); continue; }
    if (k === 'co2' && saved[k] === null) { out[k] = null; continue; }  // cleared on purpose: no CO2 figure at all
    const v = Number(saved[k]);
    if (Number.isFinite(v) && v >= 0) out[k] = v;
  }
  return out;
}
// The last 30 days of logged readings; a weekly reading counts for its 7 days. Unlogged days count for nothing.
function lossWindow(a) {

  const end = new Date(`${tl[tl.length - 1].date}T00:00:00`);
  const start = new Date(end); start.setDate(start.getDate() - 29);
  const inWindow = tl.filter((p) => new Date(`${p.date}T00:00:00`) >= start);
  let lost = 0, days = 0, dips = 0, actual = 0, expected = 0;
  for (const p of inWindow) {
    days += p.kind === 'weekly' ? 7 : 1;
    actual += p.kwh; expected += usualKwh(p, a);
    // Only the days the audit flags as dips count as loss: ordinary days scatter around the usual level.
    if (p.flagged) { dips += 1; lost += Math.max(0, usualKwh(p, a) - p.kwh); }
  }
  return { lost, days, dips, actual, expected, from: inWindow[0].date, to: tl[tl.length - 1].date, usualIsPvgis: !a.baseline.learnt };
}

  const dust = a.hypotheses.find((h) => h.cause === 'soiling');
  const dustSupported = Boolean(dust && dust.confidence !== 'low');
  const money = w.lost * A.tariff;
  const perDay = w.days ? w.lost / w.days : 0;

    el('div', { class: 'stat' }, el('span', { class: 'label', text: t('worth') }), el('span', { class: 'value', text: rupees(money) }), el('span', { class: 'sub', text: tf('atTariff', { n: A.tariff }) })));

  $('method-note').textContent = t('inEnglish');

    el('li', {}, 'Output shortfall = on each day in the last 30 that the audit flags as a dip, the shortfall below the plant\u2019s usual output (expected output from PVGIS and NASA POWER weather, scaled by the level this plant was learnt to run at), added up. Ordinary days, above or below usual, count for nothing.'),
    el('li', {}, 'Rupees = output shortfall \u00d7 tariff.'),

      button.querySelector('.tick').append(svg('path', { d: 'M4 12.5 9.5 18 20 6.5' }));
      const form = el('form', { class: 'approve', autocomplete: 'off' }, el('label', { for: id }, t('dateDidIt'), input), button);
      form.addEventListener('submit', (ev) => { ev.preventDefault(); approve(action, input.value, button); });
      if (stale(action)) {
        li.append(el('p', { class: 'note', text: t('earlierSuggestion') }));
      }
      li.append(form);
    } else {
      const why = srvProps(v.why, { class: 'note' });
      li.append(el('p', why));
      if (why['data-srv'] && why['data-srv'] !== 'translated') li.append(el('p', { class: 'note', text: t('inEnglish') }));
    }
    const speak = speakButton(() => [{ text: ACTIONS[action.kind], lang }, { text: sug.text, lang: sug.lang || lang }]);
    if (speak) li.append(el('div', { class: 'row' }, speak));
    list.append(li);
  }
}

// Pictograms with short labels: a broom for cleaning, a wrench for the inspection, a plug for the inverter.
function pictogram(kind) {
  const paths = {
    clean_panels: 'M4 4l10 10m0 0 5 2-3 3-2-5zm0 0-3 3',
    check_inverter: 'M7 3v5m10-5v5M5 8h14v5a7 7 0 0 1-14 0zm7 12v1',
    request_inspection: 'M14.5 6.5a4 4 0 0 0-5 5L3.5 17.5a1.4 1.4 0 0 0 0 2l1 1a1.4 1.4 0 0 0 2 0l6-6a4 4 0 0 0 5-5l-2.6 2.6-2.4-.6-.6-2.4z',
  };
  const wrap = el('span', { class: 'picto', 'aria-hidden': 'true' });
  const s = svg('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  s.append(svg('path', { d: paths[kind] || paths.request_inspection }));
  wrap.append(s);
  return wrap;
}

function renderTimeline(a) {
  const tl = a.timeline;
  const learnt = a.baseline.learnt;
  $('tl-sub').textContent = (!tl.length ? t('tlEmpty') : learnt ? t('tlSubUsual') : t('tlSubEstimate'))
    + (tl.length > CHART_MAX ? ` ${tf('tlShowing', { n: CHART_MAX, total: tl.length })}` : '');
  if (state.tab === 'why') drawTimelineChart();
  renderLegend(tl, a);
  renderTable(tl);
}

function drawTimelineChart() {
  const a = state.audit;
  const animate = !state.chartPlayed && !calm();
  if (a.timeline.length) state.chartPlayed = true;
  drawChart($('chart'), a.timeline.slice(-CHART_MAX), a.actions, a.flag_below, { animate });
  drawKwhChart($('kwh-chart'), a.timeline.slice(-CHART_MAX), a);
}

// Expected versus actual in kWh on one shared axis: expected is the usual level each bar is judged against.
function drawKwhChart(box, points, a) {
  box.replaceChildren();
  $('kwh-legend').replaceChildren();
  $('kwh-title').hidden = points.length < 2;
  if (points.length < 2) return;
  const W = Math.max(280, Math.round(box.clientWidth || 600));
  const H = 150;
  const m = { t: 10, r: 8, b: 20, l: 40 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const usual = (p) => usualKwh(p, a);
  const top = Math.max(1, ...points.map((p) => Math.max(p.kwh, usual(p))));
  const step = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000].find((v) => top / v <= 6) || 1000;
  const ymax = Math.ceil(top / step) * step;
  const y = (v) => m.t + ph * (1 - Math.min(v, ymax) / ymax);
  const x = (i) => m.l + (i + 0.5) * (pw / points.length);
  const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': tf('kwhChartLabel', { n: points.length }) });
  for (let t = 0; t <= ymax + 1e-9; t += step) {
    root.append(svg('line', { class: 'grid', x1: m.l, x2: W - m.r, y1: y(t), y2: y(t) }),
      svg('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end' }, String(t)));
  }
  const line = (cls, pick) => svg('polyline', { class: cls, points: points.map((p, i) => `${x(i).toFixed(1)},${y(pick(p)).toFixed(1)}`).join(' ') });
  root.append(line('expected', usual), line('actual', (p) => p.kwh));
  points.forEach((p, i) => { if (p.flagged) root.append(svg('circle', { class: 'actual-dot', cx: x(i), cy: y(p.kwh), r: 3.5 })); });
  root.append(svg('text', { x: x(0), y: H - 5, 'text-anchor': 'start' }, fmtDate(points[0].date, true)),
    svg('text', { x: x(points.length - 1), y: H - 5, 'text-anchor': 'end' }, fmtDate(points[points.length - 1].date, true)));
  box.append(root);
  const item = (key, text) => el('li', {}, key, text);
  $('kwh-title').textContent = t('kwhTitle');
  $('kwh-legend').append(item(el('span', { class: 'key-line expected' }), tf('legExpected', { u: units() })), item(el('span', { class: 'key-line actual' }), tf('legMade', { u: units() })),
    item(el('span', { class: 'swatch', style: 'background:var(--critical);border-radius:50%;width:10px;height:10px' }), t('dip')));
}

function renderSources(a) {
  const copy = (src) => (src.fixture ? ` ${t('recorded')}` : '');
  const parts = [
    tf('srcPvgis', { d: a.sources.pvgis.retrieved }) + copy(a.sources.pvgis),
    tf('srcClim', { d: a.sources.irradiance_climatology.retrieved }) + copy(a.sources.irradiance_climatology),
  ];
  const daily = a.timeline.map((p) => p.weather_source).filter(Boolean);
  if (daily.length) {
    const dates = daily.map((d) => d.retrieved).sort();
    const when = dates[0] === dates[dates.length - 1] ? dates[0] : `${dates[0]} to ${dates[dates.length - 1]}`;
    parts.push(tf('srcDaily', { d: when }) + (daily.some((d) => d.fixture) ? ` ${t('recorded')}` : ''));
  }
  $('sources').textContent = `${t('srcLead')} ${parts.join('; ')}${t('stop')}`;
}

function barPath(x, yTop, w, h, r) {
  r = Math.min(r, w / 2, h);
  const yb = yTop + h;
  return `M${x},${yb}V${yTop + r}A${r},${r} 0 0 1 ${x + r},${yTop}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${yTop + r}V${yb}Z`;
}

function pointState(p) {
  if (p.flagged) return 'dip';
  if (p.low_sun || p.relative == null) return 'dim';
  return '';
}

// Draws the bars.
function drawChart(box, points, actions, flagBelow, opts) {
  const o = opts || {};
  box.replaceChildren();
  if (!points.length) return;
  const W = Math.max(280, Math.round(box.clientWidth || 600));
  state.chartWidth = W;
  const H = 220;
  const m = { t: 14, r: 8, b: 26, l: 40 };
  const pw = W - m.l - m.r;
  const ph = H - m.t - m.b;
  const top = Math.max(1.25, ...points.map((p) => p.relative || 0));
  const ymax = Math.ceil(top / 0.25) * 0.25;
  const y = (v) => m.t + ph * (1 - Math.min(v, ymax) / ymax);
  const slot = pw / points.length;
  const bw = Math.min(24, Math.max(1, slot >= 6 ? slot - 2 : slot * 0.8));

  const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', tabindex: '0',
    'aria-label': tf('chartLabel', { n: points.length }) });
  if (o.animate) root.setAttribute('class', 'animate');
  for (let t = 0; t <= ymax + 1e-9; t += 0.5) {
    root.append(svg('line', { class: t === 0 ? 'usual' : 'grid', x1: m.l, x2: W - m.r, y1: y(t), y2: y(t) }),
      svg('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end' }, `${Math.round(t * 100)}%`));
  }
  root.append(svg('line', { class: 'usual', x1: m.l, x2: W - m.r, y1: y(1), y2: y(1) }));

  const bars = [];
  points.forEach((p, i) => {
    const v = p.relative || 0;
    const x = m.l + i * slot + (slot - bw) / 2;
    const h = Math.max(2, y(0) - y(v));
    const cls = ['bar', pointState(p), p.weather_known ? '' : 'unknown'].filter(Boolean).join(' ');
    const bar = svg('path', { class: cls, d: barPath(x, y(0) - h, bw, h, 4), 'data-dip': String(p.flagged) });
    bar.style.setProperty('--d', String(i));
    bars.push(bar);
    root.append(bar);
  });
  // Dip threshold, drawn over the bars so it stays visible; the legend names it.
  root.append(svg('line', { class: 'threshold', x1: m.l, x2: W - m.r, y1: y(flagBelow), y2: y(flagBelow) }));

  for (const act of actions) {
    if (act.status !== 'approved') continue;
    const idx = points.findIndex((p) => p.date > act.approved_on);
    if (idx <= 0) continue;
    const x = m.l + idx * slot;
    root.append(svg('line', { class: 'approved', x1: x, x2: x, y1: m.t, y2: m.t + ph }));
  }

  const labelAt = (i, anchor) => root.append(svg('text', { x: m.l + (i + 0.5) * slot, y: H - 6, 'text-anchor': anchor }, fmtDate(points[i].date, true)));
  labelAt(0, 'start');
  if (points.length > 1) labelAt(points.length - 1, 'end');
  if (points.length > 8 && W > 420) labelAt(Math.floor(points.length / 2), 'middle');

  const hit = svg('rect', { class: 'hit', x: m.l, y: m.t, width: pw, height: ph + m.b });
  root.append(hit);
  box.append(root);

  const tip = el('div', { class: 'tip', hidden: true });
  box.append(tip);
  let current = -1;
  function show(i) {
    if (i < 0 || i >= points.length) return;
    if (current >= 0) bars[current].classList.remove('active');
    current = i;
    bars[i].classList.add('active');
    const p = points[i];
    const note = p.flagged ? tf('tipDip', { n: Math.round(flagBelow * 100) })
      : p.low_sun ? t('dimDay')
      : !p.weather_known ? t('legUnknown') : '';
    tip.replaceChildren(
      el('strong', { text: p.relative == null ? t('lightNoDetail') : pctText(p) }),
      el('span', { text: `${fmtDate(p.date)}${p.kind === 'weekly' ? ` (${t('noteWeek')})` : ''}` }),
      el('span', { text: `${kwh(p.kwh)} ${units()}, ${t('expected')} ${kwh(p.expected_kwh)}` }),
      note ? el('span', { text: note }) : null);
    tip.hidden = false;
    const scale = box.clientWidth / W;
    const cx = (m.l + (i + 0.5) * slot) * scale;
    const left = Math.min(Math.max(0, cx - tip.offsetWidth / 2), box.clientWidth - tip.offsetWidth);
    tip.style.left = `${left}px`;
    tip.style.top = `${Math.max(0, y(Math.min(p.relative || 0, ymax)) * scale - tip.offsetHeight - 10)}px`;
  }
  function hide() { tip.hidden = true; if (current >= 0) bars[current].classList.remove('active'); }
  const pick = (ev) => {
    const r = root.getBoundingClientRect();
    const x = (ev.clientX - r.left) * (W / r.width);
    show(Math.floor((x - m.l) / slot));
  };
  root.addEventListener('pointermove', pick);
  root.addEventListener('pointerdown', pick);
  root.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') hide(); });
  root.addEventListener('blur', hide);
  root.addEventListener('focus', () => show(current >= 0 ? current : points.length - 1));
  root.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); show(Math.max(0, current - 1)); }
    if (ev.key === 'ArrowRight') { ev.preventDefault(); show(Math.min(points.length - 1, current + 1)); }
    if (ev.key === 'Escape') hide();
  });
}

function renderLegend(tl, a) {
  const legend = $('legend');
  legend.replaceChildren();
  if (!tl.length) return;
  const item = (key, text) => el('li', {}, key, text);
  const swatch = (color, extra) => el('span', { class: 'swatch', style: `background:${color};${extra || ''}` });
  const line = Math.round(a.flag_below * 100);
  legend.append(item(swatch('var(--series)'), t('legReading')),
    item(swatch('var(--critical)'), tf('legDip', { n: line })),
    item(el('span', { class: 'key-line dash' }), tf('legLine', { n: line })));
  if (tl.some((p) => p.low_sun)) legend.append(item(swatch('var(--dim)'), t('legDim')));
  if (tl.some((p) => !p.weather_known)) legend.append(item(swatch('var(--series)', 'opacity:.45'), t('legUnknown')));
  if (a.actions.some((x) => x.status === 'approved' && tl.some((p) => p.date > x.approved_on))) {
    legend.append(item(el('span', { class: 'key-line solid' }), t('legApproved')));
  }
}

function renderTable(tl) {
  const table = $('table');
  table.replaceChildren();
  if (!tl.length) return;
  table.append(el('thead', {}, el('tr', {},
    el('th', { scope: 'col', text: t('date') }), el('th', { scope: 'col', text: units() }),
    el('th', { scope: 'col', text: t('thExpected') }), el('th', { scope: 'col', text: t('thShare') }), el('th', { scope: 'col', text: t('thNote') }))));
  const body = el('tbody');
  for (const p of [...tl].reverse()) {
    const notes = [];
    if (p.flagged) notes.push(t('noteDip'));
    if (p.low_sun) notes.push(t('noteDim'));
    if (!p.weather_known) notes.push(t('noteUnknown'));
    if (p.kind === 'weekly') notes.push(t('noteWeek'));
    body.append(el('tr', {},
      el('td', { text: fmtDate(p.date) }), el('td', { text: kwh(p.kwh) }), el('td', { text: kwh(p.expected_kwh) }),
      el('td', { text: p.relative == null ? '–' : pctText(p) }), el('td', { text: notes.join(', ') })));
  }
  table.append(body);
}

function renderCauses(a) {
  const list = $('cause-list');
  list.replaceChildren();
  let english = false;
  a.hypotheses.forEach((h, i) => {
    const why = h.why.map((w) => srvProps(w));
    english = english || why.some((p) => p['data-srv'] && p['data-srv'] !== 'translated');
    list.append(el('li', { class: 'cause', 'data-cause': h.cause },
      el('div', { class: 'cause-head' },
        el('h3', {}, el('span', { class: 'rank', text: `${i + 1}. ` }), CAUSES[h.cause] || h.cause),
        confidence(h.confidence)),
      el('ul', {}, ...why.map((p) => el('li', p)))));
  });
  if (english) list.prepend(el('li', { class: 'note', text: t('inEnglish') }));
}

function renderEscalation(a) {
  const box = $('escalation');
  box.replaceChildren();
  const e = a.escalation;
  const button = $('draft-btn');
  if (e.suggested) {
    box.append(el('div', { class: 'callout critical' }, icon('warn'),
      el('div', {}, el('strong', { text: t('escNotBack') }),
        el('ul', {}, ...e.why.map((w) => el('li', srvProps(w)))))));
    button.className = '';
  } else {
    button.className = 'secondary';
    if (e.waiting_for_weather.length) {
      box.append(el('div', { class: 'callout' }, icon('clock'),
        el('div', {}, el('strong', { text: t('escWaiting') }),
          el('ul', {}, ...e.waiting_for_weather.map((w) => el('li', srvProps(w)))))));
    } else {
      box.append(el('p', { class: 'muted small', text: t('escAnytime') }));
    }
  }
}

let resizeFrame = 0;
new ResizeObserver(() => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => {
    const box = $('chart');
    if (!state.audit || state.tab !== 'why' || $('site').hidden) return;
    if (Math.abs(Math.round(box.clientWidth) - state.chartWidth) < 2) return;
    drawChart(box, state.audit.timeline.slice(-CHART_MAX), state.audit.actions, state.audit.flag_below, {});
    drawKwhChart($('kwh-chart'), state.audit.timeline.slice(-CHART_MAX), state.audit);
  });
}).observe($('chart'));

// ---------- start ----------
async function load(id) {
  const audit = await api('GET', `/api/sites/${encodeURIComponent(id)}/audit`);
  state.id = id;
  render(audit);
  const tab = tabFromHash();
  if (!tab) history.replaceState(null, '', `${location.pathname}${location.search}#today`);
  showTab(tab || 'today', true);
}

(async function init() {
  const fromUrl = new URLSearchParams(location.search).get('site');
  const stored = storeGet();
  let current = null;
  async function attempt(id) {
    current = id;
    $('retry').hidden = true;
    $('skeleton').hidden = false;
    $('main').setAttribute('aria-busy', 'true');
    try {
      await load(id);
      if (id === fromUrl && id !== stored && (!stored
          || confirm(t('linkOther')))) {
        storeSet(id);
      }
    } catch (e) {
      $('skeleton').hidden = true;
      if (e.status !== 404) { showError(e.message); $('retry').hidden = false; return; }
      if (id === fromUrl) {
        history.replaceState(null, '', `${location.pathname}${location.hash}`);
        if (stored && stored !== id) {
          await attempt(stored);
          if (state.audit) showError(t('linkNotFoundKept'));
          return;
        }
      }
      if (storeGet() === id) storeClear();
      showSetup(id === fromUrl ? t('linkNotFound') : t('plantGone'));
    } finally {
      $('main').removeAttribute('aria-busy');
    }
  }
  $('retry-btn').addEventListener('click', () => { showError(''); attempt(current); });
  const first = fromUrl || stored;
  if (first) await attempt(first); else showSetup();
})();
</script>
